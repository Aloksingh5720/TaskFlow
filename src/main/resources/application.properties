# Name
spring.application.name=taskflow

# Server
server.port=${PORT:9090}
server.servlet.context-path=/
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL init
spring.sql.init.mode=always

# File upload
file.upload-dir=/tmp/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.projectmanagement=DEBUG

# Super Admin
app.taskflow.admin.username=admin
app.taskflow.admin.password=admin@123
app.taskflow.admin.email=alok.ak572@gmail.com

# Mail config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aloksinghdbms@gmail.com
spring.mail.password=antqvdxhkmzzrfmh
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Database - Railway variables
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver